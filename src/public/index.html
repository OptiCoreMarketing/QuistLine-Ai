<!DOCTYPE html>
<html lang="da">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>QuistLine.ai · Chief Workspace</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;500;700&family=Inter:wght@400;600;700&display=swap" rel="stylesheet">
  <style>
    body { font-family: 'Inter', sans-serif; }
    .mono { font-family: 'JetBrains Mono', monospace; }
  </style>
</head>
<body class="bg-slate-950 text-slate-100 min-h-screen flex flex-col">

  <!-- Header -->
  <header class="border-b border-slate-800 bg-slate-900/50 backdrop-blur sticky top-0 z-50 px-6 py-4 flex items-center justify-between">
    <div class="flex items-center space-x-3">
      <div class="h-4 w-4 bg-emerald-500 rounded-full animate-pulse"></div>
      <span class="font-bold text-lg tracking-wider mono text-emerald-400">QUISTLINE.AI</span>
      <span class="text-xs bg-slate-800 text-slate-400 px-2 py-0.5 rounded border border-slate-700">Business: LeadAgent</span>
    </div>

    <!-- Groq Model Selector -->
    <div class="flex items-center space-x-3 bg-slate-900 border border-slate-800 rounded-lg p-1.5">
      <label for="groq-model" class="text-xs text-slate-400 font-medium px-2">
        <span class="text-emerald-400 font-semibold">Chief Engine:</span>
      </label>
      <select id="groq-model" class="bg-slate-950 text-slate-200 text-xs rounded border border-slate-700 px-2.5 py-1.5 focus:outline-none focus:border-emerald-500">
        <option value="llama-3.3-70b-versatile" selected>Llama 3.3 70B (Versatile)</option>
        <option value="llama-3.1-8b-instant">Llama 3.1 8B (Instant)</option>
        <option value="deepseek-r1-distill-llama-70b">DeepSeek R1 70B (Reasoning)</option>
        <option value="mixtral-8x7b-32768">Mixtral 8x7B (32k Context)</option>
      </select>
    </div>
  </header>

  <!-- Main Grid Layout -->
  <main class="flex-1 max-w-7xl w-full mx-auto p-6 grid grid-cols-1 lg:grid-cols-12 gap-6">
    
    <!-- Venstre Kolonne: Chief Terminal -->
    <section class="lg:col-span-7 flex flex-col gap-4">
      <div class="bg-slate-900 border border-slate-800 rounded-xl flex flex-col h-[650px]">
        
        <div class="px-4 py-3 border-b border-slate-800 flex justify-between items-center text-xs text-slate-400">
          <span class="mono flex items-center gap-2">
            <span class="w-2 h-2 rounded-full bg-emerald-400"></span> CHIEF TERMINAL
          </span>
          <span id="active-model-badge" class="mono text-emerald-400 bg-emerald-950/50 border border-emerald-800 px-2 py-0.5 rounded">
            llama-3.3-70b-versatile
          </span>
        </div>

        <div id="chat-box" class="flex-1 p-4 overflow-y-auto space-y-4 mono text-sm">
          <div class="bg-slate-950/60 border border-slate-800 rounded p-3 text-slate-300">
            <span class="text-emerald-400 font-bold">[Chief]:</span> Klar til opgaver, Hr. Angel. Hvad skal Engineer bygge nu?
          </div>
        </div>

        <div id="approval-bar" class="hidden px-4 py-3 bg-amber-950/30 border-t border-amber-800/50 flex justify-between items-center text-xs">
          <span class="text-amber-300 flex items-center gap-2">
            <span class="w-2 h-2 rounded-full bg-amber-400 animate-ping"></span> Chief afventer godkendelse til Engineer
          </span>
          <button 
            onclick="hireEngineer()"
            class="bg-emerald-600 hover:bg-emerald-500 text-white font-semibold px-4 py-1.5 rounded transition mono"
          >
            ✓ Godkend & Hyre Engineer
          </button>
        </div>

        <form id="agent-form" class="p-4 border-t border-slate-800 flex gap-3 bg-slate-950/40">
          <input 
            type="text" 
            id="user-input" 
            placeholder="Instruer Chief..." 
            class="flex-1 bg-slate-900 border border-slate-700 text-slate-100 rounded-lg px-4 py-2.5 text-sm focus:outline-none focus:border-emerald-500 mono"
            required
          />
          <button 
            type="submit" 
            class="bg-slate-800 hover:bg-slate-700 text-slate-200 font-semibold text-sm px-5 py-2.5 rounded-lg border border-slate-700 transition mono"
          >
            Send
          </button>
        </form>
      </div>
    </section>

    <!-- Højre Kolonne: Task Board & Reports -->
    <section class="lg:col-span-5 flex flex-col gap-4">
      <div class="bg-slate-900 border border-slate-800 rounded-xl p-4 flex-1 flex flex-col h-[650px]">
        <div class="flex justify-between items-center pb-3 border-b border-slate-800 mb-4">
          <h2 class="font-bold text-sm text-slate-200 flex items-center gap-2">
            <span>📋</span> Tasks & Rapporter (/reports)
          </h2>
          <button onclick="loadTasks()" class="text-xs text-slate-400 hover:text-emerald-400 mono">↻ Genopfrisk</button>
        </div>

        <div id="task-list" class="flex-1 overflow-y-auto space-y-3 pr-1">
          <!-- Tasks indlæses dynamisk -->
        </div>
      </div>
    </section>

  </main>

  <footer class="p-4">
    <div class="text-xs text-slate-500 mono bg-slate-900/60 border border-slate-800 px-3 py-1.5 rounded-md inline-block">
      LeadAgent · QuistLine.ai
    </div>
  </footer>

  <script>
    const modelSelect = document.getElementById('groq-model');
    const activeModelBadge = document.getElementById('active-model-badge');
    const form = document.getElementById('agent-form');
    const userInput = document.getElementById('user-input');
    const chatBox = document.getElementById('chat-box');
    const approvalBar = document.getElementById('approval-bar');
    const taskList = document.getElementById('task-list');

    let lastUserPrompt = "";

    modelSelect.addEventListener('change', (e) => activeModelBadge.textContent = e.target.value);

    loadTasks();

    form.addEventListener('submit', async (e) => {
      e.preventDefault();
      const prompt = userInput.value.trim();
      if (!prompt) return;

      lastUserPrompt = prompt;
      userInput.value = '';

      appendMessage('Owner', prompt, 'blue');
      const loaderId = appendLoader('Chief analyserer opgave');

      try {
        const response = await fetch('/api/agent', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ prompt, model: modelSelect.value, hireWorker: false })
        });

        const data = await response.json();
        removeLoader(loaderId);
        appendMessage('Chief', data.reply, 'emerald');
        approvalBar.classList.remove('hidden');

      } catch (err) {
        removeLoader(loaderId);
        appendError('Fejl ved forbindelse til Chief.');
      }
    });

    async function hireEngineer() {
      approvalBar.classList.add('hidden');
      appendMessage('System', 'Godkendt. Chief tildeler opgaven til Engineer...', 'amber');
      const loaderId = appendLoader('Engineer bygger og genererer rapport');

      try {
        const response = await fetch('/api/agent', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ prompt: lastUserPrompt, model: modelSelect.value, hireWorker: true })
        });

        const data = await response.json();
        removeLoader(loaderId);

        if (data.rawWorkerOutput) {
          appendMessage('Engineer (Worker)', data.rawWorkerOutput, 'purple');
        }
        appendMessage('Chief', data.reply, 'emerald');

        loadTasks();

      } catch (err) {
        removeLoader(loaderId);
        appendError('Fejl under Engineer afvikling.');
      }
    }

    async function loadTasks() {
      try {
        const res = await fetch('/api/tasks');
        const tasks = await res.json();
        
        if (tasks.length === 0) {
          taskList.innerHTML = `<div class="text-xs text-slate-500 text-center py-8">Ingen opgaver registreret endnu.</div>`;
          return;
        }

        taskList.innerHTML = tasks.reverse().map(t => `
          <div class="bg-slate-950 border border-slate-800 rounded p-3 text-xs flex flex-col gap-2">
            <div class="flex justify-between items-center">
              <span class="mono text-emerald-400 font-bold">${t.id}</span>
              <span class="bg-emerald-950 text-emerald-400 border border-emerald-800 px-2 py-0.5 rounded text-[10px] mono">${t.status}</span>
            </div>
            <div class="text-slate-300 font-medium">${t.title}</div>
            <div class="text-slate-500 flex justify-between items-center pt-1 border-t border-slate-900 text-[11px]">
              <span>Assigned: ${t.assignedTo}</span>
              <span class="mono text-slate-400">📄 ${t.reportFile}</span>
            </div>
          </div>
        `).join('');
      } catch (err) {
        taskList.innerHTML = `<div class="text-xs text-red-400 py-4">Kunne ikke indlæse tasks.</div>`;
      }
    }

    function appendMessage(sender, text, color) {
      const colorMap = { emerald: 'text-emerald-400', blue: 'text-blue-400', amber: 'text-amber-400', purple: 'text-purple-400' };
      chatBox.innerHTML += `
        <div class="bg-slate-950/60 border border-slate-800 rounded p-3 text-slate-300 whitespace-pre-wrap">
          <span class="${colorMap[color] || 'text-emerald-400'} font-bold">[${sender}]:</span> ${text}
        </div>
      `;
      chatBox.scrollTop = chatBox.scrollHeight;
    }

    function appendLoader(text) {
      const id = 'loader-' + Date.now();
      chatBox.innerHTML += `
        <div id="${id}" class="bg-slate-950/40 border border-slate-800/80 rounded p-3 text-slate-400 animate-pulse">
          <span class="text-emerald-400 font-bold">[System]:</span> ${text}...
        </div>
      `;
      chatBox.scrollTop = chatBox.scrollHeight;
      return id;
    }

    function removeLoader(id) {
      const elem = document.getElementById(id);
      if (elem) elem.remove();
    }

    function appendError(msg) {
      chatBox.innerHTML += `
        <div class="bg-red-950/30 border border-red-900/50 rounded p-3 text-red-400">
          <span class="font-bold">[Fejl]:</span> ${msg}
        </div>
      `;
      chatBox.scrollTop = chatBox.scrollHeight;
    }
  </script>
</body>
</html>
